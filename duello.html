<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aramızda Kalsın — Düello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1D0F26;--s:#2C1735;--s2:#3A2043;--gold:#CB9A46;--red:#C0364A;--green:#3E9B6B;--text:#F4E9DE;--mut:#B6A0BE;--line:rgba(244,233,222,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Karla',sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;padding:16px 18px 20px;display:flex;flex-direction:column}
.scr{display:none;flex-direction:column;flex:1}.scr.on{display:flex}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:38px;line-height:1.05;color:var(--gold);margin:14px 0 6px}
.sub{color:var(--mut);font-size:15px;line-height:1.5;margin:0 0 22px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
input{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);font:16px 'Karla',sans-serif;padding:13px 14px;border-radius:12px;margin-bottom:14px}
button{font:700 15px 'Karla',sans-serif;border:none;border-radius:12px;padding:15px 18px;cursor:pointer}
.pri{background:var(--gold);color:#241308;width:100%}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);width:100%}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0}
.note{color:var(--mut);font-size:13px;line-height:1.5;margin-top:12px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.code{font-family:'Fraunces',serif;font-size:64px;font-weight:600;letter-spacing:.12em;color:var(--gold);margin:6px 0 18px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;gap:6px}
.top span:nth-child(1),.top span:nth-child(2){flex:1}
.top span:nth-child(2){text-align:right}
.ib{background:transparent;color:var(--text);padding:4px 8px;font-size:18px}
#stage{height:210px;display:flex;justify-content:center;align-items:flex-end;margin-top:2px;overflow:hidden}
#hostImg{height:100%;width:auto;object-fit:contain;border-radius:18px}
@media (prefers-reduced-motion:no-preference){#hostImg.pop{animation:popIn .35s ease}@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}}
#bubble{background:var(--s);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;min-height:62px;font-family:'Fraunces',serif;font-size:17px;line-height:1.4;margin:6px 0 10px}
#qc{font-family:'Fraunces',serif;font-size:19px;line-height:1.35;margin:0 0 10px;color:var(--gold)}
#chip{color:var(--mut);font-size:13px;min-height:18px;margin-bottom:8px}
#opts{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.opt{background:var(--s2);border:1px solid var(--line);color:var(--text);text-align:left;font-size:16px;padding:14px}
.opt:disabled{opacity:.55;cursor:default}
.opt.red{background:var(--red);border-color:var(--red);opacity:1}
.opt.green{background:var(--green);border-color:var(--green);opacity:1}
#flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){#flash.go{animation:fl .6s}@keyframes fl{0%{opacity:.55}100%{opacity:0}}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="flash"></div>
<audio id="voice" preload="none"></audio>
<div id="app">
  <section class="scr on" id="home">
    <h1>Aramızda Kalsın: Düello</h1>
    <p class="sub">İki telefondan, sunucu eşliğinde bilgi yarışması. İlk doğru bilen puanı alır.</p>
    <label for="pname">Adın</label>
    <input id="pname" maxlength="16" placeholder="Adın">
    <button class="pri" id="mk">Oda Oluştur</button>
    <div class="or">veya</div>
    <input id="cd" maxlength="4" placeholder="4 haneli oda kodu" autocapitalize="characters">
    <button class="ghost" id="jn">Odaya Gir</button>
    <p class="note" id="msg"></p>
  </section>

  <section class="scr" id="lobby">
    <div class="mid">
      <p class="sub" style="margin:0">Oda kodun</p>
      <div class="code" id="code"></div>
      <p class="sub">Eşin "Odaya Gir" diyerek bu kodu yazsın. Katıldığı anda oyun iki telefonda birden başlar.</p>
      <button class="ghost" id="exit2" style="max-width:200px">Vazgeç</button>
    </div>
  </section>

  <section class="scr" id="game">
    <div class="top"><span id="sc0"></span><span id="sc1"></span><button class="ib" id="mute" aria-label="Sesi aç/kapat">🔊</button><button class="ib" id="exit" aria-label="Çık">✕</button></div>
    <div id="stage"><img id="hostImg" src="wave.png" alt="Sunucu"></div>
    <div id="bubble"><span id="txt"></span></div>
    <div id="qc"></div>
    <div id="chip"></div>
    <div id="opts"></div>
    <button class="pri" id="nx">Devam</button>
  </section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,onValue,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db=getDatabase(initializeApp({
  apiKey:"AIzaSyAiCXQjwA7_31Lf27EO3gNcTOomfYpagtg",
  authDomain:"oyna-bakalim.firebaseapp.com",
  databaseURL:"https://oyna-bakalim-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"oyna-bakalim",
  storageBucket:"oyna-bakalim.firebasestorage.app",
  messagingSenderId:"724315046366",
  appId:"1:724315046366:web:0c3bf4b39e3854c83edd4f"
}));

const Q=[
{q:"Sevgililer Günü hangi tarihte kutlanır?",o:["14 Şubat","14 Mart","1 Mayıs","14 Nisan"],c:0},
{q:"Yunan mitolojisinde aşk ve güzellik tanrıçası kimdir?",o:["Athena","Hera","Afrodit","Artemis"],c:2},
{q:"Romeo ve Juliet oyununun yazarı kimdir?",o:["Charles Dickens","William Shakespeare","Victor Hugo","Lev Tolstoy"],c:1},
{q:"Aşk-ı Memnu romanının yazarı kimdir?",o:["Reşat Nuri Güntekin","Ahmet Hamdi Tanpınar","Yakup Kadri Karaosmanoğlu","Halit Ziya Uşaklıgil"],c:3},
{q:"Taj Mahal hangi ülkededir?",o:["İran","Hindistan","Mısır","Pakistan"],c:1},
{q:"Evliliğin 25. yıl dönümüne ne ad verilir?",o:["Gümüş düğün","Altın düğün","Bronz düğün","Elmas düğün"],c:0}
];
const $=id=>document.getElementById(id);
let S=null,code=null,me=0,lastKey="",lastFlash="",muted=false,typer=null,unsub=null;
const show=id=>document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));
const setMsg=t=>{$("msg").textContent=t};
const myName=()=>($("pname").value.trim()||"Oyuncu").slice(0,16);
const FAIL="Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.";
const sref=c=>ref(db,"rooms/"+c+"/s");
const norm=s=>{s.red=s.red||[];s.lk=s.lk||[0,0];s.sc=s.sc||[0,0];s.n=s.n||["",""];return s};
const save=c=>{try{sessionStorage.setItem("ak",JSON.stringify({c,me}))}catch(e){}};

function line(){
  const N=S.n;
  if(S.ph==="intro")return [
    {t:`Merhaba ${N[0]} ve ${N[1]}! Aramızda Kalsın düellosuna hoş geldiniz.`,p:"wave",a:"welcome.mp3"},
    {t:"Kural basit: soruyu ilk doğru bilen puanı alır. Yanlış şıkka basarsanız ekran kızarır ve söz rakibe geçer.",p:"point",a:"rules.mp3"},
    {t:"Parmaklar hazırsa ilk soruya geçiyoruz!",p:"cheer",a:"start.mp3"}][S.l];
  if(S.ph==="q"){
    if(S.lw>=0)return {t:`Yanlış! Cevap hakkı ${N[1-S.lw]} tarafına geçti.`,p:"oops",a:"wrong.mp3"};
    return {t:`Soru ${S.q+1}!`,s:Q[S.q].q,p:S.q%2?"think":"point"};
  }
  if(S.ph==="rev")return S.w>=0?{t:`Doğru! Puanı ${N[S.w]} aldı.`,p:"cheer",a:"correct.mp3"}:{t:`İkiniz de bilemediniz. Doğru cevap: ${Q[S.q].o[Q[S.q].c]}.`,p:"sad",a:"nobody.mp3"};
  if(S.ph==="end"){const [x,y]=S.sc;return x===y?{t:"Berabere! İkiniz de harikasınız.",p:"wave",a:"tie.mp3"}:{t:`Kazanan ${N[x>y?0:1]}! Tebrikler.`,p:"cheer",a:"win.mp3"};}
  return {t:"",p:"point"};
}

function say(L){
  clearInterval(typer);
  const el=$("txt");el.textContent="";let i=0;
  typer=setInterval(()=>{el.textContent=L.t.slice(0,++i);if(i>=L.t.length)clearInterval(typer)},26);
  if(muted)return;
  const voice=$("voice");
  if(L.a){
    try{voice.pause();voice.currentTime=0;voice.src=L.a;voice.play().catch(()=>{})}catch(e){}
    return;
  }
  try{voice.pause()}catch(e){}
  if(!("speechSynthesis" in window)||!(L.s||L.t))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(L.s||L.t);u.lang="tr-TR";
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("tr"));
    if(v)u.voice=v;speechSynthesis.speak(u);
  }catch(e){}
}
function prime(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  try{const v=$("voice");v.play().then(()=>v.pause()).catch(()=>{})}catch(e){}
}
function flash(){const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}

function render(){
  if(!S){show("home");return}
  if(S.ph==="lobby"){show("lobby");$("code").textContent=(code||"").toUpperCase();return}
  show("game");
  const L=line(),key=[S.ph,S.l,S.q,S.lw,S.w].join();
  if(key!==lastKey){
    lastKey=key;
    const img=$("hostImg");
    img.src=L.p+".png";
    img.classList.remove("pop");void img.offsetWidth;img.classList.add("pop");
    say(L);
  }
  $("sc0").textContent=`${S.n[0]}${me===0?" (sen)":""}: ${S.sc[0]}`;
  $("sc1").textContent=`${S.n[1]}${me===1?" (sen)":""}: ${S.sc[1]}`;
  const inQ=S.ph==="q"||S.ph==="rev",q=Q[S.q];
  $("qc").style.display=inQ?"block":"none";
  $("qc").textContent=`${S.q+1}/${Q.length} · ${q.q}`;
  const box=$("opts");box.replaceChildren();
  if(inQ)q.o.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt"+(S.red.includes(i)?" red":"")+(S.ph==="rev"&&i===q.c?" green":"");
    b.textContent=t;
    b.disabled=S.ph!=="q"||!!S.lk[me]||S.red.includes(i);
    b.onclick=()=>run(me,{k:"pick",q:S.q,o:i});
    box.appendChild(b);
  });
  $("chip").textContent=S.ph==="q"?(S.lk[me]?"Yanlış bildin, söz rakipte":S.lk[1-me]?"Rakip yanlış bildi, söz sende!":"İlk basan kazanır!"):S.ph==="end"?"Oyun bitti":"";
  const fk=S.q+":"+S.red.length;
  if(S.red.length&&fk!==lastFlash)flash();
  lastFlash=fk;
  $("nx").style.display=S.ph==="q"?"none":"block";
  $("nx").textContent=S.ph==="intro"?(S.l<2?"Devam":"Başla"):S.ph==="rev"?(S.q<Q.length-1?"Sıradaki soru":"Sonucu gör"):"Yeniden oyna";
}

/* Hamleler sunucuda sırayla işlenir (transaction): ilk ulaşan hamle kazanır. */
function nq(s,q){s.ph="q";s.q=q;s.lk=[0,0];s.red=[];s.w=-1;s.lw=-1}
function apply(s,i,a){
  if(a.k==="join"){
    if(s.ph!=="lobby")return false;
    s.n[1]=a.name;s.ph="intro";s.l=0;return true;
  }
  if(a.k==="next"){
    if(a.v!==s.v)return false;
    if(s.ph==="intro"){if(s.l<2)s.l++;else nq(s,0)}
    else if(s.ph==="rev"){if(s.q<Q.length-1)nq(s,s.q+1);else s.ph="end"}
    else if(s.ph==="end"){s.sc=[0,0];nq(s,0)}
    else return false;
    return true;
  }
  if(a.k==="pick"){
    if(s.ph!=="q"||a.q!==s.q||!Number.isInteger(a.o)||a.o<0||a.o>3||s.lk[i]||s.red.includes(a.o))return false;
    if(a.o===Q[s.q].c){s.sc[i]++;s.w=i;s.ph="rev"}
    else{s.lk[i]=1;s.lw=i;s.red=[...s.red,a.o];if(s.lk[0]&&s.lk[1]){s.ph="rev";s.w=-1}}
    return true;
  }
  return false;
}
function run(i,a){
  if(!code)return Promise.resolve(null);
  return runTransaction(sref(code),cur=>{
    if(cur===null)return cur;
    const s=norm(JSON.parse(JSON.stringify(cur)));
    if(!apply(s,i,a))return;
    s.v=(s.v||0)+1;
    return s;
  }).catch(()=>null);
}

function listen(c){
  if(unsub)unsub();
  code=c;lastKey="";
  unsub=onValue(sref(c),snap=>{
    const v=snap.val();
    S=v?norm(v):null;
    render();
  });
}
function leave(){
  if(unsub)unsub();
  unsub=null;S=null;code=null;lastKey="";
  try{sessionStorage.removeItem("ak");speechSynthesis.cancel();$("voice").pause()}catch(e){}
  show("home");
}

$("mk").onclick=async()=>{
  prime();setMsg("Bağlanılıyor…");
  try{
    const al="abcdefghjkmnpqrstuvwxyz23456789";
    let c="",ok=false;
    for(let t=0;t<5&&!ok;t++){
      c="";for(let i=0;i<4;i++)c+=al[Math.floor(Math.random()*al.length)];
      ok=!(await get(sref(c))).exists();
    }
    if(!ok)return setMsg("Oda kodu üretilemedi, tekrar dene.");
    me=0;
    await set(sref(c),{ph:"lobby",l:0,q:0,sc:[0,0],lk:[0,0],w:-1,lw:-1,v:0,n:[myName(),""]});
    save(c);listen(c);setMsg("");
  }catch(e){setMsg(FAIL)}
};
$("jn").onclick=async()=>{
  prime();
  const c=$("cd").value.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(c))return setMsg("4 haneli oda kodunu yaz.");
  setMsg("Bağlanılıyor…");
  try{
    const sn=await get(sref(c));
    if(!sn.exists())return setMsg("Oda bulunamadı. Kodu kontrol et.");
    if(norm(sn.val()).ph!=="lobby")return setMsg("Bu odada oyun zaten başlamış.");
    me=1;listen(c);
    const r=await run(1,{k:"join",name:myName()});
    if(!r||!r.committed){leave();return setMsg("Odaya girilemedi. Kodu kontrol edip tekrar dene.")}
    save(c);setMsg("");
  }catch(e){leave();setMsg(FAIL)}
};
$("nx").onclick=()=>{if(S)run(me,{k:"next",v:S.v})};
$("exit").onclick=leave;
$("exit2").onclick=leave;
$("mute").onclick=()=>{
  muted=!muted;$("mute").textContent=muted?"🔇":"🔊";
  if(muted){try{speechSynthesis.cancel()}catch(e){}try{$("voice").pause()}catch(e){}}
};

try{
  const r=JSON.parse(sessionStorage.getItem("ak")||"null");
  if(r&&r.c){me=r.me;listen(r.c)}
}catch(e){}
</script>
</body>
</html>
